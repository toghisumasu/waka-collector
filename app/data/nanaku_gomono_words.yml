# 七句去物 — 百韻中でこれらの語を含む句同士は7句以上間隔を空けなければならない
# 其の五十八 Phase 0（湯山三吟・遺誡百韻・水無瀬三吟、3作品30ペア検算、違反0件）で実証済み。
# 其の六十一 D-61-1で適用。:text優先・:word フォールバックの全文部分一致方式
# （ichiza_violationsと同じ簡略実装）。地名等の誤検出リスク（例：「松が崎」）は
# 其の五十八の判断通り許容する。
#
# 依頼書2026-09-06 パッチB: ひらがな表記揺れ対策としてyomi（読み）を追加。
# ichiza_ichiku_words.ymlと同じ形式。
# 田・松はyomiを追加しない：読み（「た」「まつ」）が classical な文脈で
# 極めて高頻度に出現する部分文字列（例：「た」は過去の助動詞語尾、
# 「まつ」は「待つ」）で、追加すると誤検出が多発するため見送る。
衣:
  yomi: ころも
竹:
  yomi: たけ
田: {}
船:
  yomi: ふね
夢:
  yomi: ゆめ
涙:
  yomi: なみだ
月:
  yomi: つき
松: {}
枕:
  yomi: まくら
煙:
  yomi: けむり
